# Rung 4: the foreground/background imbalance, at the loss.
#
# 32 rather than torchvision's 256, and the census is why: over the 1123 ship-bearing training
# tiles a tile offers a mean of 3.6 positive anchors under rung 2's sizes, against the 128 a batch
# of 256 at a ceiling of 0.5 asks for. The ceiling is therefore idle and `rpn_positive_fraction`
# is not the lever; what moves the realised fraction is the batch the sampler fills around those
# few positives — 1.4% at 256, 5.6% at 64, 11.3% at 32, 22.5% at 16. See docs/decisions.md
# 2026-08-19 for the counts and for what the census contradicts.
#
# Extends rung 3 because the ladder is greedy: each rung starts from the last one that was kept.
# If R3 is rejected, this line is repointed at r2-anchors.yaml and the edit goes into
# docs/failures.md with the rejection.

extends: r3-stem.yaml

model:
  rpn_batch_size_per_image: 32

out:
  checkpoints: /kaggle/working/checkpoints-r4
  metrics: /kaggle/working/metrics-r4-sampler.json
