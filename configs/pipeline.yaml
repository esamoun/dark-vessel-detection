# Pipeline configuration. A run is defined here, not in notebook cell order.
# Paths are relative to this file.

area:
  name: danish-waters
  crs: EPSG:25832          # ETRS89 / UTM 32N

imagery:
  collection: COPERNICUS/S1_GRD
  polarisations: [VV, VH]
  resolution_m: 10

# Sized to the scene this config actually runs on. A Sentinel-1 tile is 512 px or so — what the
# detector's memory allows — but the synthetic scene is 256 px, and a tiling that swallowed it
# whole would mean the shipped configuration never crossed a tile boundary. 144/32 cuts it into
# four tiles meeting at row and column 128, where the synthetic scene stands a target.
# The overlap must be at least as wide as the largest target; see docs/decisions.md.
tiling:
  size_px: 144
  overlap_px: 32

detector:
  checkpoint_every_epoch: true   # free-tier sessions are interrupted, not finished

fusion:
  interpolate_ais_to_acquisition: false   # not yet: matching is against the nearest report in time
  match_tolerance_m: 200                  # provisional; see docs/decisions.md

# The run itself: what goes in, what comes out, and which detector does the work.
# `darkvessel synthesise --out data/synthetic` writes inputs matching the paths below.
run:
  scene: ../data/synthetic/scene.tif
  ais: ../data/synthetic/ais.csv
  output: ../outputs/detections.gpkg
  detector: bright-pixel   # deterministic stand-in: no weights, no GPU, no network
  threshold: 0.5
