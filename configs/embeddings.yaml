# The embedding level. Paths are relative to this file. Everything not stated here — the imagery,
# the tiling, the detector and its window between decibels and amplitude — is `kattegat-lane.yaml`'s,
# unchanged; `area` is still the chain's own study area, and the archive below draws on more water
# than that on purpose.
#
# Run it in four steps, in this order:
#   darkvessel scenes   --config configs/embeddings.yaml   # needs Earth Engine
#   darkvessel crops    --config configs/embeddings.yaml   # needs the detector extra
#   darkvessel embed    --config configs/embeddings.yaml   # minutes of laptop CPU
#   darkvessel retrieve --config configs/embeddings.yaml   # the check, written down
extends: kattegat-lane.yaml

# What the representation is fitted on. One acquisition of one box holds six vessels, which is not
# an archive and is not enough to learn a representation of anything; ten weeks of two boxes is.
# The question this level answers — which detections resemble which — is a question across the
# record rather than inside one scene, and the archive is what makes it one.
archive:
  # Every Sentinel-1 acquisition covering each rectangle, ascending and descending both. A vessel
  # looks different from the two passes, which is a property of the object the representation
  # should have to account for rather than one it should be protected from.
  window:
    start: 2026-06-01T00:00:00+00:00
    end: 2026-08-10T00:00:00+00:00
  # Two rectangles, because the archive is not the run. The chain's study area was chosen by
  # measurement for its traffic and it contains no fixed structure at all — so an archive drawn
  # from it alone can never show a representation telling a turbine from a ship, whatever the
  # representation does. The second box is the study area this project used until 2026-08-14 and
  # gave up for having no ships in it: a documented 111-turbine lattice and almost no traffic.
  # Between them they hold both halves of the problem. See docs/decisions.md.
  boxes:
    kattegat-lane:
      west: 11.00
      south: 57.55
      east: 11.30
      north: 57.70
    anholt:
      west: 11.15
      south: 56.58
      east: 11.40
      north: 56.71
  # One subdirectory per box below this: a Sentinel-1 product can cover both rectangles, and two
  # clips of it written flat would be one file under one name.
  scenes: ../data/archive
  crops: ../data/archive/crops.npz
  # Not the 0.90 the chain publishes at. That number was chosen for precision, because every
  # unmatched detection the chain reports is a claim someone may be sent out on. Nothing here is
  # published: this is what a representation is fitted on, and one fitted only on the objects the
  # detector was already certain about has never been shown the ones it was not — which are
  # exactly the objects this level exists to make separable. See docs/decisions.md.
  score_threshold: 0.05

embedding:
  # The optional stage of the chain. Enabled here and nowhere else: `configs/pipeline.yaml` and
  # `configs/kattegat-lane.yaml` run the chain without it, and their output is unchanged by the
  # existence of this file.
  enabled: true
  # 64 px at 10 m is 640 m of sea around the detection — room for the largest hull in this
  # archive, 274 m, with its wake and its neighbours. Larger and a crop is mostly water; smaller
  # and a container ship does not fit inside one.
  crop_px: 64
  # Cut around the crop and never shown to the encoder unaugmented. It is the room a view has to
  # be translated into: rolling a crop around its own edge would put one side of a vessel against
  # the other, and reaching past what was stored would invent pixels.
  margin_px: 8
  # How many numbers describe a detection in the layer. Sixteen is a wide attribute table and a
  # narrow representation, which is the right way round for an archive of a few hundred objects:
  # a representation with more dimensions than the archive has crops describes the crops rather
  # than what is in them.
  dim: 16
  # The equivalent number of looks a view is perturbed at, measured on this archive's own scenes
  # rather than quoted from the product specification — `darkvessel crops` prints the figure for
  # each scene it cuts. Across the fifty acquisitions it runs from 0.01 to 5.14 against a nominal
  # 4.4, and the spread is the sea rather than the processor: a calm morning backscatters at
  # -37 dB, close enough to the noise floor that its variation in decibels is five times a windy
  # day's. The median is what ships, because a view perturbed at the calmest scene's figure would
  # be perturbed harder than any real second look at this water. Empty would mean views that
  # change no pixel value at all. See docs/decisions.md.
  speckle_looks: 4.1
  encoder: ../models/embedding-archive.pt
  checkpoints: ../data/archive/embedding-checkpoints
  keep: 2
  metrics: ../docs/runs/embedding-archive.json
  schedule:
    # Half an hour of laptop CPU, which is what an archive this size deserves. The detector needed
    # a rented GPU and evenings; this does not, and saying so is part of the honest accounting of
    # what each half of this project costs.
    #
    # A hundred, where the one-box archive ran four hundred, and it was set to thirty first. The
    # reasoning for thirty was that the archive had grown thirteenfold, so thirty epochs of 4676
    # crops is 4380 gradient steps against the 4000 the one-box run took — the same amount of
    # training, an hour instead of fifteen. It was wrong, and measurably: what four hundred epochs
    # bought was not four thousand steps, it was four hundred distinct augmented views of every
    # crop, and thirty gave each crop thirty. On the identical task — the 348 Kattegat crops,
    # ranked against those 348 — the thirty-epoch encoder scored 0.319 where the one-box encoder
    # scored 0.489. For a contrastive fit on a fixed archive the unit that matters is the epoch,
    # because the epoch is how many times a crop is looked at again. See docs/failures.md.
    epochs: 100
    # Every crop in the batch that is not the pair is a negative, so the batch size is how many
    # things the loss has to tell an object apart from at once. Larger is better and the archive
    # is the ceiling.
    batch_size: 32
    learning_rate: 0.001
    # How sharply the loss distinguishes the pair from the rest. Low, because a small archive
    # needs the hardest negatives to dominate the gradient.
    temperature: 0.1
    # One number, and the run is named by it: the encoder's initialisation, the order the crops
    # arrive in and every view drawn of them are derived from it. The failure of 2026-08-14, not
    # repeated here.
    seed: 20260826
  retrieval:
    queries: 6
    neighbours: 4
    sheet: ../docs/figures/retrieval-archive.svg
    record: ../docs/runs/retrieval-archive.json

# Separating fixed structures from vessels, which is what the embedding level was ultimately for.
# Run after `embed`, and it needs no GPU and no network:
#   darkvessel known      --config configs/embeddings.yaml   # needs a network, run once
#   darkvessel structures --config configs/embeddings.yaml   # seconds of laptop CPU
structures:
  # How many distinct acquisitions a position must carry a detection in before this project will
  # stop calling detections there dark. Twenty, and the number was chosen by measurement rather
  # than by feel: it is the lowest floor at which every entry in the register stands on a
  # structure somebody else published. At ten the register also contains the object in the
  # Kattegat lane that nothing explains — and silently excluding an unexplained recurring object
  # in a shipping lane is the exact failure this whole chain exists not to commit. What twenty
  # costs is one turbine 73 m from the western edge of the box, which keeps being reported as a
  # dark candidate: an over-report, which is the safe direction. See docs/decisions.md.
  floor: 20
  # How close two detections must be to be the same standing object. Measured: a registered
  # structure's own detections sit 13 m from its centre at the median and 108 m at the worst,
  # and the masts stand 583 m apart at the closest. A sixth of the spacing and beyond the wobble.
  same_position_m: 100
  # The radius a register entry explains at run time. The same number, because it is the same
  # question — is this detection that standing object — and not the fusion's 200 m, which asks
  # whether a declared position could explain a detection. Two questions, two numbers, both
  # stated. At 200 m a register entry would cover a third of the water between two masts.
  tolerance_m: 100
  # How far a registered structure may stand from a published one and still be called the same
  # structure. Loose on purpose and load-bearing for nothing: the matches it accepts sit 5.1 m
  # apart at the median and 15.8 m at the worst, and the one position it rejects is 602 m out.
  verify_tolerance_m: 200
  # What the published coordinates are, one file per box, fetched by `darkvessel known` and kept
  # in the repository so nothing else here needs a network. The lane's file is empty, and that is
  # the control: no fixed structure is published in that box, and none is registered from it.
  known:
    anholt: ../data/reference/anholt-structures.csv
    kattegat-lane: ../data/reference/kattegat-lane-structures.csv
  # The clustering, which is what issue #14 expected to do the exclusion and does not. Eight,
  # because the archive holds a few hundred distinct objects and a partition with more parts than
  # the archive has kinds describes the crops rather than what is in them. It is reported rather
  # than acted on; the measurement that decided that is in docs/decisions.md, 2026-08-27.
  clusters: 8
  seed: 20260827
  register: ../data/reference/fixed-structures.csv
  record: ../docs/runs/structures-archive.json

run:
  # The same scene, the same declarations and the same detector as `kattegat-lane.yaml`; what
  # differs is that the layer carries sixteen more columns. Written to its own file so the two
  # can be put side by side and the embedding stage shown to change nothing else.
  output: ../outputs/kattegat-lane-embedded.gpkg
  # The fixed structures this run will not call dark vessels, written by `darkvessel structures`.
  # Over this scene it excludes nothing, because the study area contains no fixed structure — the
  # exclusion is still applied, still reported, and the layer still carries the column. A stage
  # that only shows its effect where the effect is convenient has not been demonstrated.
  structures: ../data/reference/fixed-structures.csv
