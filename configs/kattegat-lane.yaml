# A real Sentinel-1 acquisition over the northern Kattegat, and the chain run across it.
# Paths are relative to this file. `configs/pipeline.yaml` is the synthetic demo; this is the
# one that needs Earth Engine credentials and a network.

area:
  name: kattegat-lane
  crs: EPSG:25832          # ETRS89 / UTM 32N
  # The northern Kattegat on the approach to Skagen: 17.4 x 17.3 km of open water, carrying the
  # traffic between the Baltic and the Skagerrak. Chosen by measurement rather than off a map —
  # `darkvessel survey --config configs/survey.yaml` ranks every rectangle of this size in the
  # Kattegat by how many vessels of 100 m or more, under way, stand inside it at a given moment,
  # and this one comes first: 91 such vessels over 2026-08-09, 4.75 in an average half hour, and
  # never fewer than two in any half hour of the day.
  #
  # It supersedes the Anholt box, which was chosen for its wind farm and turned out to sit off
  # the lane: 30 acquisitions, 19 with no declared vessel in frame at all, and the largest ship
  # ever present 15 m long. What this gives up is the turbines — see docs/decisions.md.
  bounds:
    west: 11.00
    south: 57.55
    east: 11.30
    north: 57.70

imagery:
  collection: COPERNICUS/S1_GRD
  # VV only, and this is what the move to a bigger box costs. Earth Engine answers a single
  # download up to 48 MiB; this rectangle at 10 m came back from its grid at 57 MB in two
  # polarisations and was refused. Something had to give — the area, the resolution or a
  # polarisation — and the area is the one thing here that was measured and argued for, while
  # 20 m pixels would put a 100 m hull at five pixels and halve the point of using SAR at all.
  #
  # What it gives up: the chain reads band 1 and nothing today touches VH, but cross-polarised
  # backscatter separates a ship from the sea better than VV does, and a detector trained to use
  # both will want it. When one exists, this box needs either a smaller rectangle or an export to
  # Drive. Recorded here rather than discovered then.
  polarisations: [VV]
  resolution_m: 10
  # Searched, not required to contain a scene. One acquisition covers this box on this day —
  # 2026-08-09T05:31:24, descending — and it is the only one of the day whose footprint contains
  # the whole rectangle rather than clipping a corner of it. Six vessels stood inside the
  # rectangle at that instant, five of them 100 m or more and the largest 274 m.
  window:
    start: 2026-08-09T00:00:00+00:00
    end: 2026-08-09T12:00:00+00:00

# 800 px, because that is the size the model was trained and scored at. Tiling returns all nine
# of them at exactly 800 x 800 over this 1727 x 1845 scene, with no short tile at the far edge —
# which is the condition that makes it work: a 736 px edge tile would be resized by the very
# transform inside the model that this choice exists to keep idle, and resampling radar amplitude
# is a decision rather than a convenience. `cli.check_tile_size` refuses a mismatch rather than
# letting torchvision resize quietly. `configs/pipeline.yaml` runs 144/32 because its scene is
# 256 px. See docs/decisions.md.
tiling:
  size_px: 800
  overlap_px: 64

fusion:
  match_tolerance_m: 200
  interpolation_max_gap_s: 600
  # A vessel under way is drawn hundreds of metres from where it is, along the satellite's track,
  # because its own motion adds Doppler the processor reads as position. On this scene four
  # declared hulls of 140 to 274 m were imaged 420 to 490 m away and every one was reported dark.
  # See docs/failures.md for the measurement, including the vessel with no cross-track velocity
  # and no displacement at all.
  #
  # The direction comes off the product's ORBIT_PASS tag. The magnitude needs the incidence
  # angle, which the product does not carry — so it is declared here. 38.5 degrees is the middle
  # of a Sentinel-1 IW swath, and it is an approximation stated in the open rather than hidden:
  # across the swath the correction runs from 50 to 90 metres per m/s, and at the near edge it
  # under-corrects enough to leave two of the six vessels unmatched. When the export records the
  # real angle, this key takes it.
  azimuth:
    correct: true
    incidence_deg: 38.5

# The declarations to match against, from the Danish Maritime Authority's daily archive for the
# day the scene was acquired. `darkvessel ais --config configs/kattegat-lane.yaml` fetches them;
# the acquisition itself is read off the scene, so a slice and the scene cannot name two moments.
ais:
  # Either side of the acquisition. A vessel is placed by interpolating between the two reports
  # bracketing it, so this only has to hold a bracket: a class A vessel under way reports every
  # few seconds and one at anchor every three minutes. A quarter of an hour is generous.
  #
  # It is also the half hour `configs/survey.yaml` measures over, so the survey's count is the
  # number of declarations a run here actually has to match against rather than a statistic
  # about some other span.
  window_s: 900
  # How far outside the study area a report is still taken. A vessel imaged just inside the edge
  # of the scene reported minutes earlier from just outside it, and cutting that report away
  # leaves it with nothing to interpolate between. 5 km is what a vessel at 20 knots covers in
  # the eight minutes either side of the widest bracket this run interpolates across.
  margin_m: 5000
  # Above this, one report cannot have followed another and one of them is noise. A ceiling on
  # the physically possible rather than on the usual: the fastest thing in these waters is a
  # 40-knot ferry, and a rule that removed it would be removing evidence.
  max_speed_kn: 60
  out: ../data/real/kattegat-lane-ais.csv

# The whole archive of acquisitions over this box, rather than the single scene above. The
# analysis of #16 needs a distribution and one scene carries six detections, so the chain is run
# across every acquisition here and the detections accumulate into one layer.
#
# The scenes are the ones `darkvessel scenes --config configs/embeddings.yaml` fetched: same box,
# same polarisation, same resolution, and — checked rather than assumed — the same 1727 x 1845
# raster the tiling above is sized for.
archive:
  scenes: ../data/archive/kattegat-lane
  # One slice of declarations per acquisition, named by the scene it belongs to.
  # `darkvessel archive-ais` writes them, one archive day at a time, and skips the days it has
  # already written: 32 days of Danish AIS is 21 GB across the wire and several hours, and a
  # run that had to start again from nothing after a dropped connection would not finish.
  ais: ../data/real/archive-ais
  # Every acquisition's detections in one layer, which is what the spatial analysis reads.
  detections: ../outputs/kattegat-lane-archive.gpkg

earthengine:
  # The Cloud project `ee.Initialize` authenticates against. Left empty, Earth Engine falls back
  # to whatever the local credentials default to, which is fine on one machine and unreproducible
  # on any other. Set it to yours before the first export.
  project: "carbon-cacao-488416-s6"

export:
  out: ../data/real/kattegat-lane.tif

# What is sampled at each detection once the chain has written them, by
# `darkvessel context --config configs/kattegat-lane.yaml`. Needs the same credentials the export
# does; `darkvessel run` writes these four columns empty and never reaches for a network.
#
# The asset identifiers live here rather than in the code because the catalogue is somebody
# else's and it moves — the same reason the checkpoint path is a config key. What the code
# guarantees is that a layer it cannot sample comes back missing rather than zero.
#
# Run against Earth Engine on 2026-08-27, and the run corrected one of them: the fishing-effort
# band named below was a guess and Earth Engine refused it. That is what the identifiers being
# config keys is for. The EEZ is the one of the four that still cannot be sampled, and it is null
# on purpose. See docs/decisions.md, 2026-08-27, for what came back.
context:
  # Distance to shore. Not a published raster but a distance to a published coastline: Earth
  # Engine returns, for any feature collection, an image of the metres to its nearest feature,
  # computed on its own side. LSIB is simplified land polygons at country scale, which is coarse
  # for a fjord and adequate for the open Kattegat, where the nearest land is 10 km away and the
  # question is which side of a shipping lane a detection sits on.
  #
  # Beyond the search radius the image is masked, so "further from land than this was not
  # measured" arrives as a missing value rather than as the radius itself. 200 km is far past
  # anything in Danish waters; it is here so that the same config over the North Atlantic would
  # report unmeasured rather than wrong.
  shore:
    asset: USDOS/LSIB_SIMPLE/2017
    search_radius_m: 200000
  # Water depth, from ETOPO1's bedrock band: metres relative to sea level, so the sea is
  # negative. About 1.85 km on a side, which is a real limitation for a strait — the Kattegat's
  # depth changes over a shorter distance than one ETOPO1 cell — and it is the bathymetry the
  # public catalogue has. A finer product (GEBCO, or the Danish national survey) would be
  # ingested as an asset and named here instead, and nothing else would change.
  depth:
    asset: NOAA/NGDC/ETOPO1
    band: bedrock
  # EEZ membership. **Null on purpose, and the one variable of the four that cannot be sampled
  # from the public catalogue at all.** Marine Regions publishes the world's EEZ boundaries under
  # CC-BY; Earth Engine does not carry them, so they have to be ingested once as a table asset
  # and named here. Until that is done every detection reads `unavailable` in the `eez` column —
  # which is the point of that word existing, and is a different statement from `high seas`.
  #
  # `property` is the field of that table the name is taken from; Marine Regions calls it
  # SOVEREIGN1. It is stated here because a table whose columns are not this project's is not a
  # table this project should be guessing at.
  eez:
    asset: null
    property: SOVEREIGN1
  # Fishing effort. Global Fishing Watch's daily hours, summed over the window below — one day at
  # one point is almost always zero and says nothing about the water.
  #
  # The window is not the year of the acquisition, and it cannot be: this collection ends years
  # before these scenes were acquired. So what this samples is *where fishing effort has been
  # recorded*, which is a statement about the water rather than about the day — a detection in a
  # square that has never carried fishing hours is a different object from one in a square that
  # always has. That is the question level 4 asks, and it is worth being explicit that it is not
  # "was anyone fishing here that morning", which no public product can answer for 2026.
  effort:
    asset: GFW/GFF/V1/fishing_hours
    # One band per gear type, and there is no total band. Quoted from Earth Engine's own refusal
    # of a guessed one rather than read off a page: "Band pattern 'WLD' did not match any bands.
    # Available bands: [drifting_longlines, fixed_gear, other_fishing, purse_seines, squid_jigger,
    # trawlers]". All six are summed, so the variable is total recorded fishing hours; drop one to
    # ask about a fleet instead.
    bands: [drifting_longlines, fixed_gear, other_fishing, purse_seines, squid_jigger, trawlers]
    # The last full year the collection holds: its images run 2012-01-01 to 2016-12-31, measured
    # rather than taken from the documentation. 15 004 of them fall in this window — one per flag
    # state per day — which is why sampling this layer takes about a hundred seconds where the
    # other two take one.
    start: 2016-01-01
    end: 2017-01-01
  # The grid the layers are reduced on. Coarser than the 10 m the scene is exported at, and
  # deliberately: the finest of these four products is ETOPO1 at 1.85 km, and sampling a 1.85 km
  # cell at 10 m would not make the answer sharper, it would make it look sharper.
  scale_m: 1000

# What `darkvessel analyse` reads the accumulated layer with, and where it writes the answer.
# The last stage of the chain and the only one whose output is prose, which is why its settings
# are in the file rather than in the code: the intervals below are quoted in the README, and a
# number nobody can re-derive from a committed file is not a measurement.
analysis:
  # Quartiles of the population. Four is what 189 detections afford — at eight the bands carry
  # about 23 apiece and every interval is wide enough to overlap every other, which would report
  # "nothing found" about a resolution rather than about the water.
  bands: 4
  # Bootstrap draws for the interval around each rate. The resample is over acquisitions rather
  # than over detections, so a draw is 49 picks and 4000 of them is a hundredth of a second.
  #
  # This number does not buy reproducibility — the seed below does. A bootstrap percentile keeps
  # its own Monte Carlo error however many draws it is given, and measured over twelve seeds on
  # the archive layer the bounds move by 0.47 points at 4000 draws, 0.22 at 20 000 and 0.12 at
  # 50 000. Even 50 000 moves the digit the README prints, which is why the README says to read
  # the bounds at whole-percent resolution rather than why this number was raised. Raising it is
  # chasing an asymptote for a precision the method does not have.
  #
  # `test_the_bounds_carry_the_monte_carlo_error_the_readme_states` holds the 0.47, so the claim
  # on the page is a measurement rather than an assertion.
  draws: 4000
  # Fixed, because a figure that moves between two runs of the same command is not evidence. The
  # bands of one variable are seeded from this in order, so adding a variable cannot move the
  # numbers already published for the others.
  seed: 0
  report: ../docs/runs/analysis-archive.json
  figures: ../docs/figures

run:
  scene: ../data/real/kattegat-lane.tif
  # Written by `darkvessel ais`, from the archive for the day of the acquisition above. Run that
  # first: without the file this run has nothing to search, and a run with nothing to search says
  # `unsearched` rather than calling every detection dark.
  ais: ../data/real/kattegat-lane-ais.csv
  output: ../outputs/kattegat-lane-trained.gpkg
  detector: trained
  trained:
    # Not in the repository — 330 MB of weights, and *.pt is ignored. Epoch 12 of **R1**, the one
    # rung of the ladder in issue #11 that was kept, renamed on the way in because the baseline's
    # own epoch 12 is already in models/ under the name Kaggle gives them all.
    # sha256 785d2b7480fef925412983bab45d7ffb4675c696d74e7d4a7d39b535242013f9
    #
    # Until 2026-08-25 this named ../models/epoch-012.pt — the run of 2026-08-14, F1 0.807
    # against R1's 0.836. The ladder ran, kept a rung, and nothing repointed the chain at it: a
    # checkpoint path is measured by nothing, so the gap sat here for two days without a failing
    # test or a wrong number anywhere to show it. `test_the_chain_runs_the_weights_of_the_rung
    # _the_ladder_kept` now reads the verdict out of docs/runs/ and holds this line against it.
    #
    # These are **not** the weights the ladder judged. That session's working directory was gone
    # by 2026-08-26 and had never been saved as a version, so R1 was executed a second time from
    # the same config and the same seed. What the two executions agree on, and to what precision,
    # is in docs/decisions.md, 2026-08-26 — including that the ladder returns the same verdict on
    # all five rungs under either of them.
    checkpoint: ../models/r1-epoch-012.pt
    # The journal of the execution that produced the checkpoint above — not the ladder's, which
    # describes its sibling. Named here so the numbers this file quotes can be checked against
    # the run they came from rather than against whichever journal happens to be nearby:
    # `test_the_chains_score_threshold_holds_the_precision_the_swap_was_decided_on` reads it.
    metrics: ../docs/runs/r1-cosine-rerun.json
    # What built the model these weights came from. R1 differs from configs/train.yaml by one
    # line — the learning rate schedule — and a schedule leaves no trace in a build block, so
    # these are the values the 2026-08-14 checkpoint carried too, at seed 20260814. R1's
    # checkpoints do carry their own block, and `TrainedDetector` refuses a disagreement rather
    # than preferring one side of it; against the baseline, which predates train.py recording
    # one, these were the only statement of them.
    tile_px: 800
    anchor_sizes: [[32], [64], [128], [256], [512]]
    # Precision 0.946 against recall 0.726 on the held-out LS-SSDD split — epoch 12 of the
    # execution named above. Every detection this chain does not match against AIS becomes a dark
    # vessel, which is a claim someone may be sent out on: a miss costs a ship nobody looked at,
    # a false alarm costs an inspection and an accusation.
    #
    # The number moved from 0.75 to 0.90 with the weights so that the operating point would not.
    # A threshold is not portable across a rung that changes the schedule: cosine decay moves the
    # calibration of the scores, which is the very thing the 2026-08-14 run's oscillation was
    # made of, and 0.75 buys 0.941 precision from those weights and 0.851 from these. Held at the
    # precision the swap of 2026-08-16 was decided on, R1 finds 47 more ships (1727 against 1680)
    # and raises 7 fewer false alarms (99 against 106). See docs/decisions.md, 2026-08-25.
    #
    # What this buys on the scene rather than on the split: at 0.90 the weights of 2026-08-14
    # return four of the six declared hulls, dropping the 274 m vessel at 0.850 and the 24 m one
    # at 0.862. These return all six, the lowest at 0.927.
    score_threshold: 0.90
    # The window between the decibels this scene is in and the amplitude the model was fitted
    # on. The floor is measured: LS-SSDD's offshore held-out sea sits at 0.2000, and putting
    # this scene's sea (-21.84 dB) there fixes it once the width is known. The width could not
    # be measured — see docs/decisions.md — so it was swept from 25 to 60 dB against the
    # vessels this scene's AIS declares, and 40 dB is the middle of the range that recovers all
    # six of them. Fixed here rather than refitted per scene: refitted, it would be a percentile
    # stretch under another name and a score threshold would stop meaning the same thing from
    # one acquisition to the next.
    stretch:
      floor_db: -29.84
      ceiling_db: 10.16
      sea_db: -21.84
