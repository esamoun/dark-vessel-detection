# A real Sentinel-1 acquisition over the northern Kattegat, and the chain run across it.
# Paths are relative to this file. `configs/pipeline.yaml` is the synthetic demo; this is the
# one that needs Earth Engine credentials and a network.

area:
  name: kattegat-lane
  crs: EPSG:25832          # ETRS89 / UTM 32N
  # The northern Kattegat on the approach to Skagen: 17.4 x 17.3 km of open water, carrying the
  # traffic between the Baltic and the Skagerrak. Chosen by measurement rather than off a map —
  # `darkvessel survey --config configs/survey.yaml` ranks every rectangle of this size in the
  # Kattegat by how many vessels of 100 m or more, under way, stand inside it at a given moment,
  # and this one comes first: 91 such vessels over 2026-08-09, 4.75 in an average half hour, and
  # never fewer than two in any half hour of the day.
  #
  # It supersedes the Anholt box, which was chosen for its wind farm and turned out to sit off
  # the lane: 30 acquisitions, 19 with no declared vessel in frame at all, and the largest ship
  # ever present 15 m long. What this gives up is the turbines — see docs/decisions.md.
  bounds:
    west: 11.00
    south: 57.55
    east: 11.30
    north: 57.70

imagery:
  collection: COPERNICUS/S1_GRD
  # VV only, and this is what the move to a bigger box costs. Earth Engine answers a single
  # download up to 48 MiB; this rectangle at 10 m came back from its grid at 57 MB in two
  # polarisations and was refused. Something had to give — the area, the resolution or a
  # polarisation — and the area is the one thing here that was measured and argued for, while
  # 20 m pixels would put a 100 m hull at five pixels and halve the point of using SAR at all.
  #
  # What it gives up: the chain reads band 1 and nothing today touches VH, but cross-polarised
  # backscatter separates a ship from the sea better than VV does, and a detector trained to use
  # both will want it. When one exists, this box needs either a smaller rectangle or an export to
  # Drive. Recorded here rather than discovered then.
  polarisations: [VV]
  resolution_m: 10
  # Searched, not required to contain a scene. One acquisition covers this box on this day —
  # 2026-08-09T05:31:24, descending — and it is the only one of the day whose footprint contains
  # the whole rectangle rather than clipping a corner of it. Six vessels stood inside the
  # rectangle at that instant, five of them 100 m or more and the largest 274 m.
  window:
    start: 2026-08-09T00:00:00+00:00
    end: 2026-08-09T12:00:00+00:00

# 800 px, because that is the size the model was trained and scored at. Tiling returns all nine
# of them at exactly 800 x 800 over this 1727 x 1845 scene, with no short tile at the far edge —
# which is the condition that makes it work: a 736 px edge tile would be resized by the very
# transform inside the model that this choice exists to keep idle, and resampling radar amplitude
# is a decision rather than a convenience. `cli.check_tile_size` refuses a mismatch rather than
# letting torchvision resize quietly. `configs/pipeline.yaml` runs 144/32 because its scene is
# 256 px. See docs/decisions.md.
tiling:
  size_px: 800
  overlap_px: 64

fusion:
  match_tolerance_m: 200
  interpolation_max_gap_s: 600
  # A vessel under way is drawn hundreds of metres from where it is, along the satellite's track,
  # because its own motion adds Doppler the processor reads as position. On this scene four
  # declared hulls of 140 to 274 m were imaged 420 to 490 m away and every one was reported dark.
  # See docs/failures.md for the measurement, including the vessel with no cross-track velocity
  # and no displacement at all.
  #
  # The direction comes off the product's ORBIT_PASS tag. The magnitude needs the incidence
  # angle, which the product does not carry — so it is declared here. 38.5 degrees is the middle
  # of a Sentinel-1 IW swath, and it is an approximation stated in the open rather than hidden:
  # across the swath the correction runs from 50 to 90 metres per m/s, and at the near edge it
  # under-corrects enough to leave two of the six vessels unmatched. When the export records the
  # real angle, this key takes it.
  azimuth:
    correct: true
    incidence_deg: 38.5

# The declarations to match against, from the Danish Maritime Authority's daily archive for the
# day the scene was acquired. `darkvessel ais --config configs/kattegat-lane.yaml` fetches them;
# the acquisition itself is read off the scene, so a slice and the scene cannot name two moments.
ais:
  # Either side of the acquisition. A vessel is placed by interpolating between the two reports
  # bracketing it, so this only has to hold a bracket: a class A vessel under way reports every
  # few seconds and one at anchor every three minutes. A quarter of an hour is generous.
  #
  # It is also the half hour `configs/survey.yaml` measures over, so the survey's count is the
  # number of declarations a run here actually has to match against rather than a statistic
  # about some other span.
  window_s: 900
  # How far outside the study area a report is still taken. A vessel imaged just inside the edge
  # of the scene reported minutes earlier from just outside it, and cutting that report away
  # leaves it with nothing to interpolate between. 5 km is what a vessel at 20 knots covers in
  # the eight minutes either side of the widest bracket this run interpolates across.
  margin_m: 5000
  # Above this, one report cannot have followed another and one of them is noise. A ceiling on
  # the physically possible rather than on the usual: the fastest thing in these waters is a
  # 40-knot ferry, and a rule that removed it would be removing evidence.
  max_speed_kn: 60
  out: ../data/real/kattegat-lane-ais.csv

earthengine:
  # The Cloud project `ee.Initialize` authenticates against. Left empty, Earth Engine falls back
  # to whatever the local credentials default to, which is fine on one machine and unreproducible
  # on any other. Set it to yours before the first export.
  project: "carbon-cacao-488416-s6"

export:
  out: ../data/real/kattegat-lane.tif

run:
  scene: ../data/real/kattegat-lane.tif
  # Written by `darkvessel ais`, from the archive for the day of the acquisition above. Run that
  # first: without the file this run has nothing to search, and a run with nothing to search says
  # `unsearched` rather than calling every detection dark.
  ais: ../data/real/kattegat-lane-ais.csv
  output: ../outputs/kattegat-lane-trained.gpkg
  detector: trained
  trained:
    # Not in the repository — 330 MB of weights, and *.pt is ignored. Epoch 12 of **R1**, the one
    # rung of the ladder in issue #11 that was kept, brought down from that run's Kaggle output
    # at /kaggle/working/checkpoints-r1 and renamed on the way in, because the baseline's own
    # epoch 12 is already in models/ under the name Kaggle gives them all.
    #
    # Until 2026-08-25 this named ../models/epoch-012.pt — the run of 2026-08-14, F1 0.807
    # against R1's 0.836. The ladder ran, kept a rung, and nothing repointed the chain at it: a
    # checkpoint path is measured by nothing, so the gap sat here for two days without a failing
    # test or a wrong number anywhere to show it. `test_the_chain_runs_the_weights_of_the_rung
    # _the_ladder_kept` now reads the verdict out of docs/runs/ and holds this line against it.
    checkpoint: ../models/r1-epoch-012.pt
    # What built the model these weights came from. R1 differs from configs/train.yaml by one
    # line — the learning rate schedule — and a schedule leaves no trace in a build block, so
    # these are the values the 2026-08-14 checkpoint carried too, at seed 20260814. R1's
    # checkpoints do carry their own block, and `TrainedDetector` refuses a disagreement rather
    # than preferring one side of it; against the baseline, which predates train.py recording
    # one, these were the only statement of them.
    tile_px: 800
    anchor_sizes: [[32], [64], [128], [256], [512]]
    # Precision 0.950 against recall 0.713 on the held-out LS-SSDD split — R1 at epoch 12, from
    # docs/runs/r1-cosine.json. Every detection this chain does not match against AIS becomes a
    # dark vessel, which is a claim someone may be sent out on: a miss costs a ship nobody looked
    # at, a false alarm costs an inspection and an accusation.
    #
    # The number moved from 0.75 to 0.90 with the weights so that the operating point would not.
    # A threshold is not portable across a rung that changes the schedule: cosine decay moves the
    # calibration of the scores, which is the very thing the 2026-08-14 run's oscillation was
    # made of, and 0.75 buys 0.941 precision from those weights and 0.848 from these. Held at the
    # precision the swap of 2026-08-16 was decided on, R1 finds 15 more ships (1695 against 1680)
    # and raises 16 fewer false alarms (90 against 106). See docs/decisions.md, 2026-08-25.
    score_threshold: 0.90
    # The window between the decibels this scene is in and the amplitude the model was fitted
    # on. The floor is measured: LS-SSDD's offshore held-out sea sits at 0.2000, and putting
    # this scene's sea (-21.84 dB) there fixes it once the width is known. The width could not
    # be measured — see docs/decisions.md — so it was swept from 25 to 60 dB against the
    # vessels this scene's AIS declares, and 40 dB is the middle of the range that recovers all
    # six of them. Fixed here rather than refitted per scene: refitted, it would be a percentile
    # stretch under another name and a score threshold would stop meaning the same thing from
    # one acquisition to the next.
    stretch:
      floor_db: -29.84
      ceiling_db: 10.16
      sea_db: -21.84
