# Local environment: code, geometry checks, QGIS-adjacent inspection.
# Training happens on free-tier cloud GPUs, not here — see docs/decisions.md.
name: darkvessel
channels:
  - conda-forge
dependencies:
  - python=3.11
  - gdal
  - rasterio
  - geopandas
  - shapely
  - pyproj
  - fiona
  - numpy
  - pandas
  - matplotlib
  - jupyterlab
  - pyyaml
  - tqdm
  - pyogrio
  - pytest
  - ruff
  - pip
  - pip:
      # torch and earthengine-api are extras, not installed here: the chain runs without them.
      # `pip install -e ".[detector]"` / `".[gee]"` when a stage actually needs them.
      - -e .
