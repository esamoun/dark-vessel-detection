# Lint and the test suite, on every push and every pull request, so that a regression is caught
# by the repository rather than by the next person to read the code.
#
# CI installs with pip rather than the conda environment in environment.yml, and the difference
# is deliberate. environment.yml exists because GDAL and the geospatial stack around it are
# painful to build on a laptop; on Linux the same libraries arrive as wheels in seconds. What
# this workflow proves is the claim the README actually makes to a reader — that
# `pip install -e ".[dev]"` produces a working chain on a clean machine, with no weights, no GPU
# and no network beyond the install itself.
#
# Lint and tests are separate jobs so that a formatting slip cannot hide a failing test, and so
# that the checks list says which of the two broke without anyone opening a log.

name: CI

on:
  # Every branch, not just main: a branch is worth checking before it becomes a pull request,
  # and on a repository worked on alone that is where most pushes land.
  push:
  pull_request:

permissions:
  contents: read

# A push that supersedes another on the same ref cancels it. Nothing here is worth the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: make lint

  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report both versions. If 3.13 breaks, the 3.11 result is still worth having.
      fail-fast: false
      matrix:
        # The floor the package declares, and the version the development machine runs.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: make test
