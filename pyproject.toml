[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darkvessel"
version = "0.1.0"
description = "Detecting undeclared vessels by fusing Sentinel-1 SAR with AIS over Danish waters"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Eithan Samoun" }]

# What the chain itself needs. Deliberately free of torch and Earth Engine: the pipeline runs
# with a detector injected into it, and must stay installable and runnable without weights, a
# GPU or a network. See docs/decisions.md.
dependencies = [
    "numpy",
    "pandas",
    "rasterio",
    "affine",
    "geopandas",
    "pyogrio",
    "shapely",
    "pyproj",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
detector = ["torch", "torchvision"]   # training and CNN inference; not needed to run the chain
gee = ["earthengine-api"]             # Sentinel-1 export and contextual layers
dev = ["pytest", "ruff"]

[project.scripts]
darkvessel = "darkvessel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Leaflet, vendored under viz/vendor/ so that the page `darkvessel map` writes depends on no host
# but the basemap's. Listed here because it is data rather than a package — there is no
# __init__.py under vendor/ and there should not be — and without this an installed wheel would
# carry the generator and not the thing it copies out.
[tool.setuptools.package-data]
"darkvessel.viz" = ["vendor/leaflet-1.9.4/*", "vendor/leaflet-1.9.4/images/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
